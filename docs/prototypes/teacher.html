<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Test Maker Teacher Side</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Slab:wght@400;600;700&family=Roboto+Mono:wght@700&display=swap">
<style>
/* Layout: Tool Hero, Admin Bar, then an object-card grid (library) or three stage cards (builder). Light only, like every TBT page. */
:root{
  --tbt-blue:#0856C9; --tbt-blue-dark:#063F94;
  --tbt-canvas:#F6F8FC; --tbt-surface:#FFFFFF; --tbt-input:#F0F5FE; --tbt-selected-bg:#EDF4FF;
  --tbt-border:#D8E3F0; --tbt-ink:#1F2937; --tbt-muted:#667085; --tbt-faint:#8299B8;
  --tbt-success:#16803C; --tbt-success-bg:#ECFDF3; --tbt-error:#C62828; --tbt-error-bg:#FFF1F1;
  --tbt-white:#FFFFFF; --tbt-hero-soft:rgba(255,255,255,.82);
  --tbt-shadow:0 6px 20px rgba(24,56,96,.07); --tbt-shadow-raised:0 10px 28px rgba(8,86,201,.12);
  --tbt-focus-ring:0 0 0 3px rgba(8,86,201,.18);
  --ui:"Roboto",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --content:"Roboto Slab",Georgia,serif;
  --identity:"Roboto Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--tbt-canvas);color:var(--tbt-ink);font:400 16px/1.5 var(--ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 64px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:none;box-shadow:var(--tbt-focus-ring)}
h2,h3,p{margin:0}

.proto{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;font-size:14px;color:var(--tbt-muted);
  border:1px dashed var(--tbt-border);border-radius:12px;padding:8px 16px;background:var(--tbt-surface)}
.proto b{color:var(--tbt-ink);font-weight:600}
.spacer{flex:1}
.linkbtn{background:none;border:0;padding:4px;color:var(--tbt-blue);font-weight:600;font-size:14px;border-radius:6px}
.linkbtn:hover{text-decoration:underline}

.hero{background:linear-gradient(135deg,var(--tbt-blue),var(--tbt-blue-dark));color:var(--tbt-white);border-radius:22px;padding:32px 40px}
.hero .eyebrow{font:700 12px/1.2 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--tbt-hero-soft);margin:0 0 6px}
.hero h1{font:700 34px/1.15 var(--identity);letter-spacing:.02em;text-transform:uppercase;margin:0}
.hero .support{margin:8px 0 0;color:var(--tbt-hero-soft)}

/* Admin Bar */
.abar{display:flex;align-items:center;gap:10px;margin-top:24px}
.abar .title{min-width:234px;font:700 28px/1.2 var(--content);color:var(--tbt-blue);letter-spacing:-.01em;margin:0}
.abar .line{flex:1;height:1px;background:var(--tbt-border)}
.abar .search{position:relative;width:300px;flex:none}
.abar .search input{width:100%;height:44px;border:1px solid transparent;border-radius:12px;background:var(--tbt-input);padding:0 40px;font:400 16px var(--ui);color:var(--tbt-ink)}
.abar .search input:focus{background:var(--tbt-surface);border-color:var(--tbt-blue);outline:none;box-shadow:var(--tbt-focus-ring)}
.abar .search svg{position:absolute;left:14px;top:13px;color:var(--tbt-muted)}
.abar .search .x{position:absolute;right:6px;top:6px;width:32px;height:32px;border:0;background:none;color:var(--tbt-muted);font-size:18px;border-radius:8px}
.pillcta{flex:none;width:250px;height:53px;border-radius:999px;border:0;background:var(--tbt-blue);color:var(--tbt-white);font:600 16px var(--ui);text-transform:uppercase;letter-spacing:.08em}
.pillcta:hover{background:var(--tbt-blue-dark)}
.summary{font-size:14px;color:var(--tbt-muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

/* library */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px}
.card{background:var(--tbt-surface);border:1px solid var(--tbt-border);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--tbt-shadow);transition:box-shadow .2s}
.card:hover{box-shadow:var(--tbt-shadow-raised)}
.card h3{font:700 18px/1.35 var(--content);text-wrap:balance}
.card .meta{font-size:14px;color:var(--tbt-muted);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.status{border-radius:999px;padding:2px 10px;font:600 12px var(--ui)}
.status.pub{background:var(--tbt-success-bg);color:var(--tbt-success)}
.status.draft{background:var(--tbt-input);color:var(--tbt-muted)}
.card .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.empty{color:var(--tbt-muted);padding:32px 0}

/* buttons */
.btn{height:44px;padding:0 20px;border-radius:12px;font-weight:600;border:1px solid var(--tbt-border);background:var(--tbt-surface);color:var(--tbt-blue-dark)}
.btn:hover{background:var(--tbt-selected-bg)}
.btn.sm{height:36px;padding:0 14px;font-size:14px;border-radius:10px}
.btn.primary{background:var(--tbt-blue);border-color:var(--tbt-blue);color:var(--tbt-white)}
.btn.primary:hover{background:var(--tbt-blue-dark)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--tbt-selected-bg)}
.btn.danger{color:var(--tbt-error);border-color:transparent;background:none}
.btn.danger:hover{background:var(--tbt-error-bg)}
.btn:disabled{opacity:.5;cursor:default}
.icon{width:40px;height:40px;border-radius:10px;border:0;background:none;color:var(--tbt-muted);font-size:18px;padding:0}
.icon:hover{background:var(--tbt-selected-bg);color:var(--tbt-blue)}
.icon.del:hover{background:var(--tbt-error-bg);color:var(--tbt-error)}
.icon:disabled{opacity:.3;cursor:default;background:none}

/* builder */
.back{align-self:flex-start}
.stage{background:var(--tbt-surface);border:1px solid var(--tbt-border);border-radius:22px;box-shadow:var(--tbt-shadow);padding:40px;display:flex;flex-direction:column;gap:24px}
.stage > h2{font:700 22px/1.3 var(--content)}
.stage > .sub{color:var(--tbt-muted);margin-top:-16px}
.stages{display:flex;flex-direction:column;gap:40px}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field > label,.field > .lab{font-weight:600}
.field .hint{font-size:14px;color:var(--tbt-muted)}
input[type=text],input[type=number],textarea{border:1px solid transparent;border-radius:12px;background:var(--tbt-input);padding:10px 16px;font:400 16px/1.5 var(--ui);color:var(--tbt-ink);width:100%}
input[type=text],input[type=number]{height:44px;padding-block:0}
input:focus,textarea:focus{background:var(--tbt-surface);border-color:var(--tbt-blue);outline:none;box-shadow:var(--tbt-focus-ring)}
.slab{font-family:var(--content) !important}
textarea{resize:vertical;min-height:88px}

.q{border:1px solid var(--tbt-border);border-radius:16px;background:var(--tbt-surface)}
.q.open{border-color:var(--tbt-blue)}
.q.bad{border-color:var(--tbt-error)}
.qhead{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px}
.qhead .n{flex:none;width:36px;height:36px;border-radius:10px;background:var(--tbt-selected-bg);color:var(--tbt-blue-dark);font-weight:600;display:grid;place-content:center;font-variant-numeric:tabular-nums}
.qhead .sum{flex:1;min-width:0;border:0;background:none;text-align:left;padding:8px;border-radius:8px;font:400 16px/1.4 var(--content);color:var(--tbt-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qhead .sum.blank{color:var(--tbt-faint)}
.qhead .ok{flex:none;font-size:13px;color:var(--tbt-faint)}
.qhead .ok.miss{color:var(--tbt-error);font-weight:600}
.qbody{padding:8px 24px 24px;display:flex;flex-direction:column;gap:24px;border-top:1px solid var(--tbt-border);padding-top:24px}
.ans{display:flex;flex-direction:column;gap:8px}
.arow{display:flex;align-items:center;gap:8px}
.arow .let{flex:none;width:20px;color:var(--tbt-muted);font-family:var(--content)}
.arow input[type=radio]{appearance:none;flex:none;width:22px;height:22px;border:2px solid var(--tbt-muted);border-radius:50%;margin:0;display:grid;place-content:center;cursor:pointer}
.arow input[type=radio]:checked{border-color:var(--tbt-success);background:var(--tbt-success)}
.arow input[type=radio]:checked::before{content:"✓";color:var(--tbt-white);font-size:13px;font-weight:700;line-height:1}
.arow input[type=radio]:focus-visible{box-shadow:var(--tbt-focus-ring);outline:none}
.arow.right input[type=text]{background:var(--tbt-success-bg)}
.rowline{display:flex;flex-wrap:wrap;align-items:center;gap:12px}

.seg{display:inline-flex;border:1px solid var(--tbt-border);border-radius:12px;overflow:hidden;align-self:flex-start}
.seg label{padding:10px 16px;cursor:pointer;font-weight:500;color:var(--tbt-muted)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--tbt-selected-bg);color:var(--tbt-blue-dark);font-weight:600}
.seg label:has(input:focus-visible){box-shadow:inset var(--tbt-focus-ring)}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:32px}
.pct{display:flex;align-items:center;gap:8px}
.pct input{width:110px}
.switch{display:flex;align-items:center;gap:12px;cursor:pointer}
.switch input{appearance:none;width:44px;height:26px;border-radius:999px;background:var(--tbt-border);position:relative;margin:0;flex:none;transition:background .15s;cursor:pointer}
.switch input::before{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--tbt-white);transition:transform .15s}
.switch input:checked{background:var(--tbt-blue)}
.switch input:checked::before{transform:translateX(18px)}
.switch input:focus-visible{box-shadow:var(--tbt-focus-ring);outline:none}

select{height:44px;border:1px solid transparent;border-radius:12px;background:var(--tbt-input);padding:0 12px;font:400 16px var(--ui);color:var(--tbt-ink);width:100%}
select:focus{background:var(--tbt-surface);border-color:var(--tbt-blue);outline:none;box-shadow:var(--tbt-focus-ring)}
.imp{border:1px solid var(--tbt-border);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:24px;background:var(--tbt-canvas)}
.imp h3{font:700 18px/1.3 var(--content)}
.tblwrap{overflow-x:auto;border:1px solid var(--tbt-border);border-radius:12px;background:var(--tbt-surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--tbt-border);vertical-align:top;white-space:pre-line}
th{font-weight:600;color:var(--tbt-muted);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.qc{font-family:var(--content);min-width:220px}
tr.badrow td{background:var(--tbt-error-bg)}
td .prob{color:var(--tbt-error);font-weight:600}
td .fine{color:var(--tbt-success);font-weight:600}
.imp textarea{font-family:ui-monospace,Consolas,monospace;font-size:14px;min-height:120px;background:var(--tbt-surface);border-color:var(--tbt-border)}
.feat{display:block;max-width:420px;width:100%;border-radius:12px;border:1px solid var(--tbt-border)}
/* results */
.rhead{display:flex;flex-direction:column;gap:8px}
.rhead h2{font:700 28px/1.25 var(--content);color:var(--tbt-blue);letter-spacing:-.01em;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.stat{background:var(--tbt-surface);border:1px solid var(--tbt-border);border-radius:16px;padding:16px 24px}
.stat .v{font:700 28px/1.2 var(--content);font-variant-numeric:tabular-nums}
.stat .k{font-size:14px;color:var(--tbt-muted)}
.rtools{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px}
.rtools .search{position:relative;width:300px;max-width:100%}
.rtools .search input{padding-left:16px}
.check{display:flex;align-items:center;gap:8px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--tbt-blue);margin:0}
.rt td,.rt th{white-space:nowrap;vertical-align:middle}
.rt td.name{font-weight:600;white-space:normal}
.rt .guest{font-weight:400;color:var(--tbt-faint);font-size:13px;margin-left:6px}
.rt tr.att{cursor:pointer}
.rt tr.att:hover td{background:var(--tbt-selected-bg)}
.rt tr.att.sel td{background:var(--tbt-selected-bg)}
.rt td.num{font-variant-numeric:tabular-nums}
.meter{display:inline-block;width:72px;height:6px;border-radius:999px;background:var(--tbt-input);vertical-align:middle;margin-left:10px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--tbt-blue);border-radius:999px}
.rt td.detail{white-space:normal;background:var(--tbt-canvas);padding:16px 24px}
.alist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.alist li{display:grid;grid-template-columns:24px 1fr;gap:2px 8px;font-size:14px}
.alist .m{font-weight:700}
.alist .okm{color:var(--tbt-success)}.alist .badm{color:var(--tbt-error)}
.alist .qq{font-family:var(--content);font-size:15px}
.alist .aa{grid-column:2;color:var(--tbt-muted)}
.alist .aa b{font-weight:600}
.alist .aa .y{color:var(--tbt-error)}.alist .aa .r{color:var(--tbt-success)}
.hard{display:flex;flex-direction:column;gap:12px;list-style:none;margin:0;padding:0}
.hard li{display:grid;grid-template-columns:64px 1fr;gap:16px;align-items:baseline}
.hard .p{font:700 18px var(--content);color:var(--tbt-error);font-variant-numeric:tabular-nums}
.hard .t{font-family:var(--content);min-width:0}
.hard .t span{display:block;font:400 14px var(--ui);color:var(--tbt-muted)}
.savebar{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.note{border-radius:12px;padding:12px 16px;font-size:15px}
.note.err{background:var(--tbt-error-bg);color:var(--tbt-error);border:1px solid var(--tbt-error)}
.note.ok{background:var(--tbt-success-bg);color:var(--tbt-success);border:1px solid var(--tbt-success)}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;color:var(--tbt-error)}

@media (max-width:1100px){
  .abar{flex-wrap:wrap}.abar .line{display:none}
  .abar .title{flex:1;min-width:0}
  .abar .search{order:3;width:100%}
}
@media (max-width:640px){
  .hero{padding:24px}.hero h1{font-size:24px}
  .stage{padding:24px}.qbody{padding:16px}
  .pillcta{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>

<div class="wrap">
  <div class="proto">
    <span><b>Prototype</b> · what the teacher sees. The tests listed are examples.</span>
    <span class="spacer"></span>
    <button class="linkbtn" id="reset" type="button">Start over</button>
  </div>
  <header class="hero">
    <p class="eyebrow">The Blue Tree</p>
    <h1>Test Maker</h1>
    <p class="support">Build tests your students take one question at a time.</p>
  </header>
  <main id="app"></main>
</div>

<script>
const L = "abcdef";
let uid = 1;
const mkq = (text, opts, key) => ({id:uid++, text, opts:opts.slice(), key});
const CLASSES = [{id:"c1", name:"B2 Tuesday group"}, {id:"c2", name:"C1 Business English"}, {id:"c3", name:"Matura 2027"}];
const LESSONS = [{id:"l1", name:"3 November"}, {id:"l2", name:"10 November"}, {id:"l3", name:"17 November"}];
const className = id => (CLASSES.find(c=>c.id===id)||{}).name || "";
const TEMPLATE = [["question","answer_a","answer_b","answer_c","answer_d","correct"],
  ["Tom: This weather is just horrible today.\nJenny: You can say that again!\n\nCo Jenny ma na myśli?","Masz całkowitą rację.","Nie jestem pewien.","Powtórz to głośniej.","","a"],
  ["Które zdanie jest poprawne?","I am agree with you.","I agree to you.","I agree with you.","I agree you.","c"]];
const GRAMMAR = [
  ["She ___ to work by bus every day.", ["go","goes","is going"], 1],
  ["I ___ never been to Chile.", ["have","has","am"], 0],
  ["If it rains, we ___ at home.", ["stay","stayed","will stay"], 2],
  ["This is the ___ film I have ever seen.", ["good","better","best"], 2],
  ["He asked me where I ___.", ["live","lived","do live"], 1]
];
function seed(){
  uid = 1;
  return [
    {id:"t1", title:"Expressing Opinions in English", intro:"Check how well you understand the phrases people use to agree, disagree and give an opinion.",
     status:"pub", attempts:14, feedback:"end", bulls:true, pass:"", classId:"c1", lesson:"", access:"login", cert:true,
     questions:[
       mkq("Tom: This weather is just horrible today.\nJenny: You can say that again!\n\nCo Jenny ma na myśli, mówiąc: “You can say that again!”", ["Masz całkowitą rację.","Nie jestem pewien.","Powtórz to głośniej."], 0),
       mkq("Alita: Working from home is the future.\nPete: I couldn’t agree more.\n\nCo Pete ma na myśli?", ["Nie mogę się z tym zgodzić.","Zgadzam się w stu procentach.","Zgadzam się tylko częściowo."], 1),
       mkq("_____, the film was far too long.\n\nKtóry zwrot poprawnie wprowadza opinię?", ["According to me","In my meaning","As far as I’m concerned"], 2),
       mkq("Sven: We should cancel the meeting.\nKat: I’m not so sure about that.\n\nCo robi Kat?", ["Grzecznie wyraża wątpliwość.","Zgadza się ze Svenem.","Prosi o powtórzenie."], 0),
       mkq("Które zdanie jest poprawne?", ["I am agree with you.","I agree to you.","I agree with you."], 2)
     ]},
    {id:"t2", title:"General English Grammar – Diagnostic Test", intro:"One hundred questions, from beginner to advanced.",
     status:"pub", attempts:37, feedback:"end", bulls:true, pass:"", classId:"", lesson:"", access:"open", cert:false,
     questions:Array.from({length:100}, (_,i)=>mkq(...GRAMMAR[i%GRAMMAR.length]))},
    {id:"t3", title:"Phrasal verbs: travel", intro:"", status:"draft", attempts:0, feedback:"now", bulls:true, pass:"70", classId:"c2", lesson:"l2", access:"login", cert:false,
     questions:[ mkq("We ___ at six in the morning to catch the first ferry.", ["set off","set up","set in"], 0),
                 mkq("The plane ___ two hours late.", ["took up","took off","took over"], 1) ]}
  ];
}
// Example attempts, generated the same way every time so the numbers stay put.
const NAMES = ["Ola","Bartek","Kasia","Michał","Zuzanna","Piotr","Agnieszka","Tomek","Julia","Marek","Ewa","Krzysztof","Natalia","Wojtek"];
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const NOW = new Date(2026, 10, 11, 21, 30);
const attemptCache = {};
function attemptsFor(t){
  if(attemptCache[t.id]) return attemptCache[t.id];
  const r = rng(t.id.charCodeAt(1)*977 + t.questions.length), n = t.questions.length;
  const hard = t.questions.map(()=>0.15 + r()*0.6);
  const list = Array.from({length:t.attempts}, (_,i)=>{
    const who = Math.floor(r()*NAMES.length), skill = 0.35 + ((who*37)%60)/100;
    const answers = t.questions.map((q,k)=>{ if(r() < 0.02) return null;
      if(r() < Math.min(0.97, skill + (1-hard[k])*0.45)) return q.key;
      const wrong = q.opts.map((_,x)=>x).filter(x=>x!==q.key); return wrong[Math.floor(r()*wrong.length)]; });
    const score = answers.filter((a,k)=>a===t.questions[k].key).length;
    const when = new Date(NOW.getTime() - Math.floor(r()*21*24*60)*60000 - i*3600000);
    return {id:t.id+"-"+i, name:NAMES[who], guest:t.access==="open" && r()<0.6, answers, score, pct:Math.round(score/n*100),
      secs:Math.round(n*(18+r()*30)), when};
  }).sort((a,b)=>b.when-a.when);
  return attemptCache[t.id] = list;
}
const fmtDate = d => d.toLocaleDateString("en-GB",{day:"numeric",month:"short"}) + ", " + d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
const fmtTime = s => s>=3600 ? Math.floor(s/3600)+" h "+Math.round(s%3600/60)+" min" : Math.floor(s/60)+" min "+String(s%60).padStart(2,"0")+" s";
let res = null;
let tests = seed(), view = "lib", search = "", draft = null, openQ = null, msg = null, confirmDel = null, copied = null, imp = null;
const app = document.getElementById("app");
const esc = t => String(t).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fold = t => t.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ł/g,"l").toLowerCase();
const problems = q => { const p=[]; if(!q.text.trim()) p.push("no question text");
  if(q.opts.filter(o=>o.trim()).length<2) p.push("needs two answers"); if(q.key===null || !(q.opts[q.key]||"").trim()) p.push("no correct answer"); return p; };

function render(){ app.innerHTML = view==="lib" ? library() : view==="res" ? results() : builder(); }

function library(){
  const q = fold(search.trim());
  const list = tests.filter(t => !q || fold(t.title).includes(q) || t.questions.some(x=>fold(x.text).includes(q)));

function results(){
  const t = tests.find(x=>x.id===res.id), all = attemptsFor(t), n = t.questions.length, pass = +t.pass || 0;

  if(res.best){ const top = {}; list.forEach(a=>{ if(!top[a.name] || a.score>top[a.name].score) top[a.name]=a; }); list = list.filter(a=>top[a.name]===a); }
  const avg = all.length ? Math.round(all.reduce((s,a)=>s+a.pct,0)/all.length) : 0;
  const people = new Set(all.map(a=>a.name)).size, best = all.reduce((m,a)=>Math.max(m,a.pct),0);
  const rate = t.questions.map((qq,k)=>({k, pct: all.length ? Math.round(all.filter(a=>a.answers[k]===qq.key).length/all.length*100) : 0}));

// Reads comma-, semicolon- or tab-separated text, with quoted cells that may hold line breaks.
function parseTable(text){
  text = text.replace(/^\uFEFF/,"").replace(/\r\n?/g,"\n");
  const head = text.split("\n")[0] || "";
  const count = ch => head.split(ch).length-1;
  const d = count("\t") ? "\t" : (count(";") > count(",") ? ";" : ",");
  const out = []; let row = [], cell = "", q = false;
  for(let i=0;i<text.length;i++){ const ch = text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=ch; }
    else if(ch==='"' && cell==="") q=true;
    else if(ch===d){ row.push(cell); cell=""; }
    else if(ch==="\n"){ row.push(cell); out.push(row); row=[]; cell=""; }
    else cell+=ch; }
  if(cell!=="" || row.length){ row.push(cell); out.push(row); }
  return out.filter(r=>r.some(c=>c.trim()!==""));
}
function readRows(text){
  let rows = parseTable(text);
  let offset = 1;
  if(rows.length && rows[0][0].trim().toLowerCase()==="question"){ rows = rows.slice(1); offset = 2; }
  return rows.map((r,i)=>{ const cells = r.map(c=>c.trim());
    const qtext = cells[0] || "", c = (cells[cells.length-1] || "").toLowerCase();
    const opts = cells.slice(1, cells.length-1).filter(o=>o!=="").slice(0,6);
    let key = null;
    if(/^[a-f]$/.test(c)) key = L.indexOf(c); else if(/^[1-6]$/.test(c)) key = +c-1;
    else { const m = opts.findIndex(o=>o.toLowerCase()===c); if(c && m>=0) key = m; }
    let problem = "";
    if(!qtext) problem = "No question text";
    else if(opts.length<2) problem = "Needs at least two answers";
    else if(key===null) problem = "Correct answer missing";
    else if(key>=opts.length) problem = "Correct letter has no answer";
    return {row:i+offset, text:qtext, opts, key: key!==null && key<opts.length ? key : null, problem}; });
}

const findQ = id => draft.questions.find(q=>q.id===+id);
function startEdit(t){ imp = null; draft = JSON.parse(JSON.stringify(t)); openQ = draft.questions.length ? null : null; msg = null; view = "build"; render(); window.scrollTo({top:0}); }
function commit(status){
  draft.title = draft.title.trim();
  if(!draft.title){ msg = {type:"err", text:"Give the test a title."}; return render(); }
  if(status==="pub"){
    if(!draft.questions.length){ msg = {type:"err", text:"Add at least one question before publishing."}; return render(); }
    const badAt = draft.questions.map((q,i)=>problems(q).length?i+1:0).filter(Boolean);
    if(badAt.length){ msg = {type:"err", text:`${badAt.length===1?"Question":"Questions"} ${badAt.slice(0,8).join(", ")}${badAt.length>8?"…":""} ${badAt.length===1?"is":"are"} not finished.`};
      openQ = draft.questions[badAt[0]-1].id; return render(); }
  }
  draft.status = status;
  const i = tests.findIndex(t=>t.id===draft.id);
  const copy = JSON.parse(JSON.stringify(draft));
  if(i<0) tests.unshift(copy); else tests[i] = copy;
  msg = {type:"ok", text: status==="pub" ? "Published. Students can take this test now." : "Draft saved."};
  render();
}

  const t = e.target;
  if(t.id==="rsearch"){ res.search = t.value; const pos = t.selectionStart; render(); const s = document.getElementById("rsearch"); s.focus(); s.setSelectionRange(pos,pos); return; }
  if(t.id==="search"){ search = t.value; const pos = t.selectionStart; render(); const s = document.getElementById("search"); s.focus(); s.setSelectionRange(pos,pos); return; }
  if(!draft) return;
  if(t.id==="imp-text"){ if(imp){ imp.text = t.value; } return; }
  if(t.dataset.o!==undefined){ findQ(t.dataset.q).opts[+t.dataset.o] = t.value; return; }
  if(t.dataset.q && t.dataset.f==="text"){ findQ(t.dataset.q).text = t.value; return; }
  if(t.dataset.f){ draft[t.dataset.f] = t.value; }
});
app.addEventListener("change", e=>{
  const t = e.target;
  if(t.id==="rbest"){ res.best = t.checked; return render(); }
  if(!draft) return;
  if(t.name==="fb"){ draft.feedback = t.value; return render(); }
  if(t.id==="f-bulls"){ draft.bulls = t.checked; return render(); }
  if(t.id==="f-cert"){ draft.cert = t.checked; return render(); }
  if(t.id==="f-mail"){ draft.mail = t.checked; return render(); }
  if(t.id==="f-img" && t.files && t.files[0]){ const fr = new FileReader();
    fr.onload = () => { if(draft){ draft.image = String(fr.result); render(); } }; fr.readAsDataURL(t.files[0]); return; }
  if(t.name==="acc"){ draft.access = t.value; return render(); }
  if(t.id==="f-class"){ draft.classId = t.value; if(!t.value) draft.lesson=""; return render(); }
  if(t.id==="f-lesson"){ draft.lesson = t.value; return; }
  if(t.id==="f-pass"){ return render(); }
  if(t.id==="imp-file" && t.files && t.files[0]){ const fr = new FileReader();
    fr.onload = () => { if(!imp) return; imp.text = String(fr.result); imp.rows = readRows(imp.text); render(); };
    fr.readAsText(t.files[0]); return; }
  if(t.dataset.k!==undefined && t.type==="radio"){ findQ(t.dataset.q).key = +t.dataset.k; return render(); }
});
app.addEventListener("keydown", e=>{
  if(e.key==="Escape" && e.target.id==="search" && search){ search=""; render(); document.getElementById("search").focus(); }
});
app.addEventListener("click", e=>{
  const b = e.target.closest("button");
  if(!b){ const row = e.target.closest("tr.att"); if(row && res){ res.open = res.open===row.dataset.att ? null : row.dataset.att; res.del=null; render(); } return; }
  if(!b.dataset.act) return;
  const a = b.dataset.act, id = b.dataset.id, q = b.dataset.q ? findQ(b.dataset.q) : null;
  const qi = q ? draft.questions.indexOf(q) : -1;
  switch(a){
    case "clear": search=""; return render();
    case "new": return startEdit({id:"t"+Date.now(), title:"", intro:"", status:"draft", attempts:0, feedback:"end", bulls:true, pass:"", classId:"", lesson:"", access:"login", cert:false, mail:false, image:"", questions:[]});
    case "results": res = {id, search:"", best:false, open:null, all:false, del:null}; view="res"; render(); return window.scrollTo({top:0});
    case "att": res.open = res.open===b.dataset.att ? null : b.dataset.att; res.del=null; return render();
    case "att-all": res.all = !res.all; return render();
    case "att-del": res.del = b.dataset.att; return render();
    case "att-del-no": res.del = null; return render();
    case "att-del-yes": { const t = tests.find(x=>x.id===res.id); attemptCache[t.id] = attemptsFor(t).filter(a=>a.id!==b.dataset.att); t.attempts = attemptCache[t.id].length; res.open=null; res.del=null; return render(); }
    case "edit": return startEdit(tests.find(t=>t.id===id));
    case "del": confirmDel=id; return render();
    case "del-no": confirmDel=null; return render();
    case "del-yes": tests = tests.filter(t=>t.id!==id); confirmDel=null; return render();
    case "copy": { const url = "https://thebluetree.pl/test/" + fold(tests.find(t=>t.id===id).title).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") + "/";
      copied=id; render(); if(navigator.clipboard) navigator.clipboard.writeText(url).catch(()=>{}); setTimeout(()=>{ copied=null; if(view==="lib") render(); },1600); return; }
    case "back": view="lib"; draft=null; msg=null; imp=null; res=null; render(); return window.scrollTo({top:0});
    case "toggle": openQ = openQ===q.id ? null : q.id; return render();
    case "addq": { const n = mkq("", ["","",""], null); draft.questions.push(n); openQ=n.id; msg=null; render(); const f=document.getElementById("qt"+n.id); if(f) f.focus(); return; }
    case "delq": draft.questions.splice(qi,1); return render();
    case "up": draft.questions.splice(qi-1,0,draft.questions.splice(qi,1)[0]); return render();
    case "down": draft.questions.splice(qi+1,0,draft.questions.splice(qi,1)[0]); return render();
    case "addo": { q.opts.push(""); render(); const f=document.getElementById(`qo${q.id}-${q.opts.length-1}`); if(f) f.focus(); return; }
    case "delo": { const k=+b.dataset.k; q.opts.splice(k,1); q.key = q.key===k ? null : (q.key>k ? q.key-1 : q.key); return render(); }
    case "imp-open": imp = {text:"", rows:null, copied:false}; render(); { const el=document.getElementById("imp"); if(el) el.scrollIntoView({block:"nearest"}); } return;
    case "imp-close": imp = null; return render();
    case "imp-check": imp.rows = readRows(imp.text); return render();
    case "imp-tpl": { const tsv = TEMPLATE.map(r=>r.map(c=>/[\n\t"]/.test(c) ? '"'+c.replace(/"/g,'""')+'"' : c).join("\t")).join("\n");
      imp.copied = true; render(); if(navigator.clipboard) navigator.clipboard.writeText(tsv).catch(()=>{}); return; }
    case "imp-add": { const add = imp.rows.filter(r=>!r.problem).map(r=>mkq(r.text, r.opts, r.key));
      draft.questions.push(...add); imp = null; msg = {type:"ok", text:`${add.length} question${add.length===1?"":"s"} added. Save to keep them.`}; return render(); }
    case "img-del": draft.image = ""; return render();
    case "save": return commit(draft.status==="pub" ? "pub" : "draft");
    case "publish": return commit("pub");
  }
});
document.getElementById("reset").addEventListener("click", ()=>{ for(const k in attemptCache) delete attemptCache[k]; res=null; tests=seed(); view="lib"; search=""; draft=null; msg=null; confirmDel=null; imp=null; render(); });
render();
</script>
