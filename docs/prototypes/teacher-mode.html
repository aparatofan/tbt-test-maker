<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>TBT Test Maker · Teacher Mode prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Slab:wght@400;600;700&family=Roboto+Mono:wght@700&display=swap">
<style>
:root{
  --tbt-blue:#0856C9; --tbt-blue-dark:#063F94;
  --tbt-canvas:#F6F8FC; --tbt-surface:#FFFFFF; --tbt-input:#F0F5FE; --tbt-selected-bg:#EDF4FF;
  --tbt-border:#D8E3F0; --tbt-blue-wash:#E3EEFD; --tbt-faint:#8299B8; --tbt-periwinkle:#7BA7E8; --tbt-ink:#1F2937; --tbt-muted:#667085;
  --tbt-success:#16803C; --tbt-success-bg:#ECFDF3; --tbt-error:#C62828; --tbt-error-bg:#FFF1F1;
  --tbt-white:#FFFFFF;
  --tbt-shadow:0 6px 20px rgba(24,56,96,.07);
  --tbt-focus-ring:0 0 0 3px rgba(8,86,201,.18);
  --ui:"Roboto",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --content:"Roboto Slab",Georgia,serif;
  --identity:"Roboto Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--tbt-canvas);color:var(--tbt-ink);font:400 16px/1.5 var(--ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 64px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:none;box-shadow:var(--tbt-focus-ring)}

/* prototype strip */
.proto{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;font-size:14px;color:var(--tbt-muted);
  border:1px dashed var(--tbt-border);border-radius:12px;padding:8px 16px;background:var(--tbt-surface)}
.proto b{color:var(--tbt-ink);font-weight:600}
.proto label{display:flex;align-items:center;gap:8px;cursor:pointer}
.proto .spacer{flex:1}
.proto select{font:inherit;color:var(--tbt-ink);border:1px solid var(--tbt-border);border-radius:8px;padding:4px 8px;background:var(--tbt-surface)}
.linkbtn{background:none;border:0;padding:4px;color:var(--tbt-blue);font-weight:600;font-size:14px;border-radius:6px}
.linkbtn:hover{text-decoration:underline}

/* page head (live page: title + intro under the Divi TBT header, no Tool Hero) */
.head h1{font:700 28px/1.25 var(--content);margin:0}
.head p{margin:8px 0 0;color:var(--tbt-muted);max-width:720px}

/* stage */
.stage{background:var(--tbt-surface);border:1px solid var(--tbt-border);border-radius:22px;box-shadow:var(--tbt-shadow);padding:40px;display:flex;flex-direction:column;gap:32px;transition:border-color .2s,box-shadow .2s}
.stage.teacher{border-color:var(--tbt-periwinkle);box-shadow:0 0 0 4px var(--tbt-blue-wash),var(--tbt-shadow)}
h2{font:700 22px/1.3 var(--content);margin:0}
.muted{color:var(--tbt-muted)}
.facts{display:flex;flex-wrap:wrap;gap:8px 32px;margin:0;padding:0;list-style:none;color:var(--tbt-muted)}
.facts strong{color:var(--tbt-ink);font-weight:600}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.row .spacer{flex:1}

/* buttons */
.btn{height:44px;padding:0 24px;border-radius:12px;font-weight:600;border:1px solid var(--tbt-border);background:var(--tbt-surface);color:var(--tbt-blue-dark);transition:transform .15s,background .15s}
.btn:hover{background:var(--tbt-selected-bg)}
.btn.primary{background:var(--tbt-blue);border-color:var(--tbt-blue);color:var(--tbt-white)}
.btn.primary:hover{background:var(--tbt-blue-dark);transform:translateY(-1px)}
.btn.cta{height:53px;min-width:250px;border-radius:999px;background:var(--tbt-blue);border-color:var(--tbt-blue);color:var(--tbt-white);text-transform:uppercase;letter-spacing:.08em}
.btn.cta:hover{background:var(--tbt-blue-dark)}
.btn:disabled{opacity:.5;cursor:default;transform:none}

/* mode switch: only teachers and admins see it */
.modebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.modebar .spacer{flex:1}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--tbt-input);border:1px solid var(--tbt-border)}
.seg button{border:0;background:none;height:32px;padding:0 16px;border-radius:999px;font:600 13px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--tbt-muted)}
.seg button[aria-pressed="true"]{background:var(--tbt-blue);color:var(--tbt-white)}
.seg button:not([aria-pressed="true"]):hover{color:var(--tbt-blue-dark)}
.tnote{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--tbt-blue-dark);background:var(--tbt-blue-wash);border-radius:999px;padding:6px 12px}
.tnote::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--tbt-blue)}

/* progress */
.prog{display:flex;flex-direction:column;gap:8px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;font-size:13px;color:var(--tbt-faint)}
.meta .spacer{flex:1}
.tiles{display:flex;align-items:center;gap:8px}
.dots{flex:1;min-width:0;display:grid;gap:8px}
.dot{height:40px;min-width:0;border-radius:10px;border:1px solid var(--tbt-border);background:var(--tbt-surface);color:var(--tbt-muted);font-weight:600;font-size:14px;padding:0;
  font-variant-numeric:tabular-nums;transition:background .2s,color .2s,border-color .2s,transform .2s}
.dot:hover{border-color:var(--tbt-blue);color:var(--tbt-blue);transform:translateY(-2px)}
.dot.done{background:var(--tbt-blue-wash);color:var(--tbt-blue-dark);border-color:var(--tbt-periwinkle)}
.dot.here{box-shadow:0 0 0 2px var(--tbt-surface),0 0 0 4px var(--tbt-blue)}

/* question */
.qnum{font:700 28px/1 var(--content);border-left:6px solid var(--tbt-blue);padding:4px 0 4px 16px;margin:0}
.qbody{font:400 20px/1.6 var(--content);display:flex;flex-direction:column;gap:4px}
.qbody p{margin:0}
.qbody .ask{margin-top:16px}
.qbody.gaps p{line-height:2.3}
.opts{display:flex;flex-direction:column;gap:12px;border:0;padding:0;margin:0}
.opt{display:flex;align-items:center;gap:16px;padding:12px 16px;border:1px solid var(--tbt-border);border-radius:12px;cursor:pointer;font:400 18px/1.4 var(--content);background:var(--tbt-surface)}
.opt:hover{background:var(--tbt-selected-bg)}
.opt input{appearance:none;width:20px;height:20px;flex:none;border:2px solid var(--tbt-muted);border-radius:50%;margin:0;display:grid;place-content:center}
.opt input:checked{border-color:var(--tbt-blue)}
.opt input:checked::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--tbt-blue)}
.opt:has(input:checked){border-color:var(--tbt-blue);background:var(--tbt-selected-bg)}
/* teacher mode: read-only, key marked */
.opts.key .opt{cursor:default}
.opts.key .opt:hover{background:var(--tbt-surface)}
.opts.key .opt .letter{width:20px;flex:none;text-align:center;font:600 15px var(--ui);color:var(--tbt-faint)}
.opts.key .opt.right,.opts.key .opt.right:hover{border-color:var(--tbt-success);background:var(--tbt-success-bg)}
.opts.key .opt.right .letter{color:var(--tbt-success)}
.opt .tag{margin-left:auto;font:600 14px var(--ui);color:var(--tbt-success);white-space:nowrap}

.gapin{display:inline-block;width:9ch;min-width:9ch;max-width:100%;height:1.9em;margin:0 2px;padding:0 10px;vertical-align:baseline;
  border:1px solid var(--tbt-border);border-bottom:2px solid var(--tbt-blue);border-radius:8px;background:var(--tbt-input);
  font:600 1em/1 var(--content);color:var(--tbt-blue-dark);text-align:center}
.gapin:focus{outline:none;background:var(--tbt-surface);border-color:var(--tbt-blue);box-shadow:var(--tbt-focus-ring)}
.gapkey{display:inline-block;margin:0 2px;padding:0 10px;line-height:1.7;border-radius:8px;border:1px solid var(--tbt-success);border-bottom-width:2px;
  background:var(--tbt-success-bg);color:var(--tbt-success);font-weight:600}
.gapkey .alt{font-weight:400;opacity:.8}

.ph{border:1px dashed var(--tbt-border);border-radius:12px;padding:32px 16px;text-align:center;color:var(--tbt-muted);font-size:14px}

@media (max-width:640px){
  .stage{padding:24px;gap:24px}
  .qbody{font-size:18px}.opt{font-size:16px}
  .btn.cta{min-width:0;width:100%}
  .tiles{gap:4px}.dots{gap:4px}.dot{font-size:13px;border-radius:8px}
}
@media (prefers-reduced-motion:reduce){.btn,.dot,.stage{transition:none}.dot:hover{transform:none}}
</style>

<div class="wrap">
  <div class="proto">
    <span><b>Prototype</b> · Teacher Mode</span>
    <span class="spacer"></span>
    <label for="who">Logged in as <select id="who"><option value="teacher">Teacher / admin</option><option value="student">Student</option></select></label>
    <label for="set">Test <select id="set"><option value="mc">Multiple choice</option><option value="sent">Gap-fill · sentences</option><option value="para">Gap-fill · one paragraph</option></select></label>
    <button class="linkbtn" id="reset" type="button">Start over</button>
  </div>

  <header class="head">
    <h1 id="title">Expressing Opinions</h1>
    <p>Check how well you understand the phrases people use to agree, disagree and give an opinion.</p>
  </header>

  <main class="stage" id="stage"></main>
</div>

<script>
const MC = [
  {lines:[["Tom","This weather is just horrible today."],["Jenny","You can say that again!"]], ask:'Co Jenny ma na myśli, mówiąc: <em>“You can say that again!”</em>', opts:["Masz całkowitą rację.","Nie jestem pewien.","Powtórz to głośniej."], key:0},
  {lines:[["Alita","Working from home is the future."],["Pete","I couldn’t agree more."]], ask:'Co Pete ma na myśli?', opts:["Nie mogę się z tym zgodzić.","Zgadzam się w stu procentach.","Zgadzam się tylko częściowo."], key:1},
  {lines:[["","_____, the film was far too long."]], ask:'Który zwrot poprawnie wprowadza opinię?', opts:["According to me","In my meaning","As far as I’m concerned"], key:2},
  {lines:[["Sven","We should cancel the meeting."],["Kat","I’m not so sure about that."]], ask:'Co robi Kat?', opts:["Grzecznie wyraża wątpliwość.","Zgadza się ze Svenem.","Prosi o powtórzenie."], key:0},
  {lines:[["Kat","I see your point, but…"]], ask:'Co zwykle następuje po tym zwrocie?', opts:["Pełna zgoda.","Inne zdanie.","Zmiana tematu."], key:1},
  {lines:[], ask:'Które zdanie jest poprawne?', opts:["I am agree with you.","I agree to you.","I agree with you."], key:2},
  {lines:[["Pete","Pineapple on pizza is a crime."],["Alita","Oh, come on!"]], ask:'Co wyraża Alita?', opts:["Pełną zgodę.","Niedowierzanie i sprzeciw.","Prośbę o wyjaśnienie."], key:1},
  {lines:[["","If you ask me, the old logo was better."]], ask:'Co znaczy <em>“If you ask me”</em>?', opts:["Moim zdaniem","Jeśli zapytasz mnie później","Zapytaj mnie"], key:0},
  {lines:[["Alita","Cheaper tickets would bring more people."],["Sven","That’s a good point."]], ask:'Co robi Sven?', opts:["Zmienia temat.","Odrzuca argument.","Przyznaje, że argument jest trafny."], key:2},
  {lines:[], ask:'Który sprzeciw jest najbardziej uprzejmy?', opts:["You’re wrong.","I’m afraid I see it differently.","That’s nonsense."], key:1}
];
// Gap answers in square brackets; | separates answers that are all accepted (as in the 0.5.0 builder).
const GAPS = {
  sent: [
    {lines:[["Alita","Working from home is the future."],["Pete","I couldn’t agree [more]."]], ask:"Uzupełnij odpowiedź Pete’a jednym słowem."},
    {lines:[["","As [far] as I’m [concerned], the film was far too long."]], ask:"Uzupełnij zwrot, który wprowadza opinię."},
    {lines:[["Pete","Pineapple on pizza is a crime."],["Alita","Really? I [don’t|do not] think so."]], ask:"Alita się nie zgadza. Uzupełnij jej odpowiedź."},
    {lines:[["","If you [ask] me, the old logo was better."]], ask:"Uzupełnij zwrot, który znaczy „moim zdaniem”."},
    {lines:[["Sven","We should cancel the meeting."],["Kat","I’m not so [sure] about that."]], ask:"Kat ma wątpliwości. Uzupełnij jej odpowiedź."}
  ],
  para: [
    {lines:[["","Last night Kat and Sven had a long talk about working from home. In Kat’s [opinion], the office is a thing of the past. Sven did not agree [with] her. “I see your [point],” he said, “but people need to meet face to [face].” Kat was not so [sure] about that. “If you [ask] me,” she answered, “most meetings could be an email.” In the end they agreed to [disagree|differ]."]],
     ask:"Uzupełnij tekst. W każdą lukę wpisz jedno słowo."}
  ]
};
Object.values(GAPS).forEach(set=>set.forEach(q=>{ q.keys=[];
  q.rows = q.lines.map(([who,t])=>{ const parts=[]; const re=/\[([^\]]+)\]/g; let last=0, m;
    while((m=re.exec(t))){ parts.push({t:t.slice(last,m.index)}); parts.push({g:q.keys.length}); q.keys.push(m[1].split("|").map(x=>x.trim())); last=re.lastIndex; }
    parts.push({t:t.slice(last)}); return {who, parts}; }); }));

const L = "abc", MODE_KEY = "tbttm-mode";
const stage = document.getElementById("stage"), whoEl = document.getElementById("who"), setEl = document.getElementById("set");
let Q = MC, N = MC.length, s;
function esc(t){ return String(t).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
// The mode is remembered on this device; Learner is the default, so a projected screen never shows answers by surprise.
function savedMode(){ try{ return localStorage.getItem(MODE_KEY)==="teacher" ? "teacher" : "learner"; }catch(e){ return "learner"; } }
function fresh(){ return {view:"landing", i:0, mode:savedMode(), answers:Array(N).fill(null)}; }
function setTest(){ Q = setEl.value==="mc" ? MC : GAPS[setEl.value]; N = Q.length; s = fresh(); }
const isGap = () => setEl.value!=="mc";
const canTeach = () => whoEl.value==="teacher";
const teaching = () => canTeach() && s.mode==="teacher";
const answered = () => s.answers.filter(a=>a!==null && (!Array.isArray(a) || a.every(x=>x))).length;

function modebar(){
  if(!canTeach()) return "";
  return `<div class="modebar">
    <div class="seg" role="group" aria-label="Mode">
      <button type="button" data-mode="learner" aria-pressed="${s.mode==="learner"}">Learner</button>
      <button type="button" data-mode="teacher" aria-pressed="${s.mode==="teacher"}">Teacher</button>
    </div>
    ${teaching() ? `<span class="tnote">Answers are showing · nothing is saved</span>` : ""}
    <span class="spacer"></span>
    ${teaching() && s.view==="quiz" ? `<span class="muted" style="font-size:13px">← → to move between questions</span>` : ""}
  </div>`;
}

function render(){
  stage.classList.toggle("teacher", teaching());
  stage.innerHTML = modebar() + (s.view==="landing" ? landing() : s.view==="quiz" ? question() : result());
}

function landing(){
  const t = teaching(), gaps = isGap() ? Q.reduce((n,q)=>n+q.keys.length,0) : 0;
  return `
    <div>
      <h2>${t ? "Answer key" : "Before you start"}</h2>
      <p class="muted" style="margin:8px 0 0">${t
        ? "Go through the test with the correct answers already marked. Your students’ results are not affected."
        : (isGap() ? "Type one word in each gap." : "Read each question and choose one answer.") + " You can go back and change an answer at any time."}</p>
    </div>
    <ul class="facts">
      <li><strong>${gaps || N}</strong> ${gaps ? "gaps" : "questions"}</li>
      ${t ? "" : `<li>About <strong>${Math.max(2,Math.round(N*0.8))}</strong> minutes</li><li>Answers are <strong>saved as you go</strong></li>`}
    </ul>
    <div class="row">
      <button class="btn cta" type="button" data-act="start">${t ? "Show the answers" : "Start test"}</button>
    </div>`;
}

function gapBody(q, t){
  const a = s.answers[s.i] || [];
  return q.rows.map(r=>`<p>${r.who?`<strong>${esc(r.who)}:</strong> `:""}${r.parts.map(p=> p.t!==undefined ? esc(p.t)
    : t ? `<span class="gapkey">${esc(q.keys[p.g][0])}${q.keys[p.g].length>1?` <span class="alt">/ ${q.keys[p.g].slice(1).map(esc).join(" / ")}</span>`:""}</span>`
        : `<input class="gapin" data-g="${p.g}" value="${esc(a[p.g]||"")}" aria-label="Gap ${p.g+1}" autocomplete="off" spellcheck="false">`).join("")}</p>`).join("");
}

function question(){
  const q = Q[s.i], t = teaching(), last = s.i===N-1, a = s.answers[s.i];
  const tiles = N>1 ? `<div class="prog">
      <div class="tiles"><div class="dots" style="grid-template-columns:repeat(${N},minmax(0,1fr))">
        ${Q.map((_,i)=>{ const v=s.answers[i], done = !t && v!==null && (!Array.isArray(v)||v.every(x=>x));
          return `<button type="button" class="dot ${done?"done":""} ${i===s.i?"here":""}" data-go="${i}" aria-label="Question ${i+1}">${i+1}</button>`; }).join("")}
      </div></div>
      <div class="meta"><span>Question ${s.i+1} of ${N}${t ? "" : ` · ${N-answered()} left`}</span><span class="spacer"></span>${t ? "" : `<span>✓ Saved</span>`}</div>
    </div>` : "";
  const body = isGap()
    ? `<div class="qbody gaps">${gapBody(q,t)}<p class="ask">${q.ask}</p></div>`
    : `<div class="qbody">${q.lines.map(([who,x])=>`<p>${who?`<strong>${esc(who)}:</strong> `:""}${esc(x)}</p>`).join("")}<p class="${q.lines.length?"ask":""}">${q.ask}</p></div>
       <fieldset class="opts ${t?"key":""}" aria-label="Answers">
        ${q.opts.map((o,k)=> t
          ? `<div class="opt ${k===q.key?"right":""}"><span class="letter">${L[k]}</span>${esc(o)}${k===q.key?`<span class="tag">✓ Correct</span>`:""}</div>`
          : `<label class="opt" for="o${k}"><input type="radio" name="ans" id="o${k}" value="${k}" ${a===k?"checked":""}>${L[k]}) ${esc(o)}</label>`).join("")}
       </fieldset>`;
  const right = last
    ? (t ? `<button class="btn" type="button" data-go="0">Back to question 1</button>` : `<button class="btn cta" type="button" data-act="finish">Finish test</button>`)
    : `<button class="btn primary" type="button" data-act="next">Next question</button>`;
  return `${tiles}
    ${N>1 ? `<p class="qnum">${s.i+1}.</p>` : ""}
    ${body}
    <div class="row">
      ${N>1 ? `<button class="btn" type="button" data-act="back" ${s.i===0?"disabled":""}>Back</button>` : ""}
      <span class="spacer"></span>${right}
    </div>`;
}

function result(){
  return `<h2>Here is your result</h2><div class="ph">The result screen is unchanged in Learner Mode.<br>Teacher Mode never reaches it: there is no Finish button and nothing is sent.</div>
    <div class="row"><button class="btn" type="button" data-act="again">Start over</button></div>`;
}

function go(i){ s.i = Math.max(0, Math.min(N-1, i)); render(); }
stage.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.mode){ s.mode = b.dataset.mode; try{ localStorage.setItem(MODE_KEY, s.mode); }catch(err){} return render(); }
  if(b.dataset.go!==undefined){ if(s.view!=="quiz") s.view="quiz"; return go(+b.dataset.go); }
  switch(b.dataset.act){
    case "start": s.view="quiz"; return go(0);
    case "next": return go(s.i+1);
    case "back": return go(s.i-1);
    case "finish": s.view="result"; return render();
    case "again": s = fresh(); return render();
  }
});
stage.addEventListener("change", e=>{ if(e.target.name==="ans"){ s.answers[s.i]=+e.target.value; render(); } });
stage.addEventListener("input", e=>{ if(e.target.classList.contains("gapin")){ const q=Q[s.i];
  const arr = s.answers[s.i] || Array(q.keys.length).fill(""); arr[+e.target.dataset.g]=e.target.value.trim(); s.answers[s.i]=arr; } });
document.addEventListener("keydown", e=>{
  if(!teaching() || s.view!=="quiz" || e.target.matches("input,select,textarea")) return;
  if(e.key==="ArrowRight") go(s.i+1); else if(e.key==="ArrowLeft") go(s.i-1);
});
whoEl.addEventListener("change", render);
setEl.addEventListener("change", ()=>{ setTest(); render(); });
document.getElementById("reset").addEventListener("click", ()=>{ setTest(); render(); });
setTest(); render();
</script>
